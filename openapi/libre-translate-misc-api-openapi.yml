openapi: 3.2.0
info:
  title: LibreTranslate Misc API
  version: 1.9.6
  description: Free and Open Source Machine Translation API.
  license:
    name: AGPL-3.0
servers:
- url: /
tags:
- name: Misc
paths:
  /health:
    get:
      summary: Health Check
      tags:
      - Misc
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/health-response'
      operationId: getHealth
      x-operation-id-source: derived
  /suggest:
    post:
      summary: Submit a Suggestion to Improve a Translation
      tags:
      - Misc
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/suggest-response'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error-response'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                q:
                  description: Original text
                s:
                  description: Suggested translation
                source:
                  description: Language of original text
                target:
                  description: Language of suggested translation
              required:
              - q
              - s
              - source
              - target
      operationId: postSuggest
      x-operation-id-source: derived
  /frontend/settings:
    get:
      summary: Retrieve Frontend Settings
      tags:
      - Misc
      responses:
        '200':
          description: frontend settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/frontend-settings'
      operationId: getFrontendSettings
      x-operation-id-source: derived
components:
  schemas:
    error-response:
      type: object
      properties:
        error:
          type: string
          description: Error message
    suggest-response:
      type: object
      properties:
        success:
          type: boolean
          description: Whether submission was successful
    health-response:
      type: object
      properties:
        status:
          type: string
          description: Health status
          example: ok
    frontend-settings:
      type: object
      properties:
        apiKeys:
          type: boolean
          description: Whether the API key database is enabled.
        keyRequired:
          type: boolean
          description: Whether an API key is required.
        charLimit:
          type: integer
          description: Character input limit for this language (-1 indicates no limit)
        frontendTimeout:
          type: integer
          description: Frontend translation timeout
        suggestions:
          type: boolean
          description: Whether submitting suggestions is enabled.
        supportedFilesFormat:
          type: array
          description: Supported files format
          items:
            type: string
        language:
          type: object
          properties:
            source:
              type: object
              properties:
                code:
                  type: string
                  description: Language code
                name:
                  type: string
                  description: Human-readable language name (in English)
            target:
              type: object
              properties:
                code:
                  type: string
                  description: Language code
                name:
                  type: string
                  description: Human-readable language name (in English)
